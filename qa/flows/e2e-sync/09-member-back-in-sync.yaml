# Class mode two-device E2E (MEMBER, Android): Back in sync returns this phone
# to where the class is (the runner checks the step against the host's log).
appId: com.joshapproved.freeworkouttimer
---
- tapOn: "Back in sync"
- extendedWaitUntil:
    visible: "Pause"
    timeout: 5000
- assertNotVisible: "You've stepped out.*"
